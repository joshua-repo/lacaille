<!doctype html>
<html><head><meta charset="utf-8"><style>
$fonts
*{box-sizing:border-box;margin:0}
body{width:1200px;height:627px;background:$bg;color:$ink;font-family:'$body';overflow:hidden;position:relative}
body::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:$gradient}
.wrap{display:grid;grid-template-columns:410px 1fr;height:100%;padding:46px 48px 32px}
.left{display:flex;flex-direction:column;padding-right:36px;border-right:1px solid $rule}
.kicker{font:600 11.5px '$body';letter-spacing:.19em;text-transform:uppercase;color:$accent}
h1{font:500 34px/1.16 '$head';margin-top:16px}
.num{margin-top:auto;font:500 68px/1 '$head';color:$accent;font-variant-numeric:lining-nums}
.numsub{margin-top:10px;font:400 14px/1.45 '$body';color:$sub}
.lockup{margin-top:22px;padding-top:16px;border-top:1px solid $rule}
.right{padding-left:28px;display:flex;flex-direction:column}
.chart{flex:1;min-height:0}.chart svg{width:100%;height:100%}
.foot{text-align:right;margin-top:8px;font:400 11px '$body';color:$muted}
</style></head><body><div class="wrap">
<div class="left"><div class="kicker">$kicker</div><h1>$title</h1>
<div class="num">$number</div><div class="numsub">$numsub</div>
<div class="lockup">$lockup</div></div>
<div class="right"><div class="chart">$chart</div><div class="foot">$footer</div></div>
</div></body></html>
