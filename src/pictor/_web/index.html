    padding: 3px 7px 3px 6px;
    cursor: default;
    transition: box-shadow 0.15s;
  }
  .chip:hover { box-shadow: 0 0 0 1px var(--border), 0 4px 16px rgba(0,0,0,0.12); }
  .chip.loss { border-left-color: var(--critical); }
  .chip.zone { box-shadow: 0 0 0 2px var(--warning), 0 0 10px rgba(250,178,25,0.35); }
  .chip .tk { font-size: 11.5px; font-weight: 600; }
  .chip .strikes { font-size: 10.5px; color: var(--text-secondary); }
  .chip .badges {
    position: absolute;
    top: 3px; right: 4px;
    display: flex;
    gap: 2px;
  }
  .chip .diamond {
    width: 7px; height: 7px;
    background: var(--cat-orange);
    transform: rotate(45deg);
  }
  .chip .star { width: 9px; height: 9px; color: var(--cat-yellow); }

  .gantt-card { padding-bottom: 8px; }
  .gantt-row {
    display: grid;
    grid-template-columns: 150px 1fr;
    align-items: center;
    gap: 12px;
    padding: 7px 18px;
    border-bottom: 1px solid var(--gridline);
  }
  .gantt-row:hover { background: var(--accent-wash); }
  .gantt-label .tk { font-size: 12px; font-weight: 600; }
  .gantt-label .strikes { font-size: 11px; color: var(--text-secondary); }
  .gantt-track { position: relative; height: 24px; }
  .gantt-track .zone-band {
    position: absolute;
    left: 0; top: 2px; bottom: 2px;
    background: rgba(250, 178, 25, 0.16);
  }
  .gantt-track .bar {
    position: absolute;
    left: 0; top: 5px; height: 14px;
    background: var(--good);
    min-width: 3px;
  }
  .gantt-track .bar.loss { background: var(--critical); }
  .gantt-track .tip-label {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 11px;
    color: var(--text-secondary);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .gantt-track .marker {
    position: absolute;
    top: 50%;
    transform: translate(-50%, -50%);
  }
  .gantt-track .marker.diamond {
    width: 8px; height: 8px;
    background: var(--cat-orange);
    transform: translate(-50%, -50%) rotate(45deg);
  }
  .gantt-track .marker.star { width: 11px; height: 11px; color: var(--cat-yellow); }
  .gantt-axis {
    display: grid;
    grid-template-columns: 150px 1fr;
    padding: 8px 18px 12px;
  }
  .gantt-axis .ticks {
    position: relative;
    height: 18px;
    border-top: 1px solid var(--gridline);
  }
  .gantt-axis .tick {
    position: absolute;
    top: 5px;
    font-size: 10px;
    color: var(--text-muted);
    transform: translateX(-50%);
  }
  .gantt-empty, .cal-empty {
    padding: 40px;
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
  }

  .tooltip {
    position: fixed;
    z-index: 20;
    background: var(--text-primary);
    color: var(--surface-solid);
    font-size: 12px;
    line-height: 1.5;
    padding: 8px 10px;
    pointer-events: none;
    max-width: 240px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25), 0 0 20px var(--glow);
    opacity: 0;
    transition: opacity 0.1s;
  }
  .tooltip.show { opacity: 1; }
  .tooltip b { font-weight: 600; }
  .tooltip .row { display: flex; justify-content: space-between; gap: 12px; }

  table.data {
    width: 100%;
    border-collapse: collapse;
    background: var(--surface-1);
    backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur);
    box-shadow: inset 0 1px 0 var(--edge), 0 10px 30px var(--shade);
    border: 1px solid var(--border);
    overflow: hidden;
    font-size: 13px;
  }
  table.data th, table.data td {
    text-align: left;
    padding: 9px 14px;
    border-bottom: 1px solid var(--gridline);
  }
  table.data tr:hover td { background: var(--accent-wash); }
  table.data th {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text-muted);
    font-weight: 600;
  }
  table.data td.num { font-variant-numeric: tabular-nums; }
  table.data td.good { color: var(--good-text); }
  table.data td.critical { color: var(--critical); }
  table.data tr:last-child td { border-bottom: none; }

  /* ---- NumberTicker ---------------------------------------------------
     A port of https://github.com/joshua-repo/NumberTicker (SwiftUI, itself
     modelled on Robinhood's ticker). Each digit is its own wheel of 0-9 that
     springs into place while separators, the currency symbol and the sign
     stay put.

     Faithful to the original in the parts that make it read as that
     component: digits run 9 -> 0 top to bottom, so a *rising* digit rolls the
     strip downward; every wheel is driven by one spring with no stagger; and
     the first paint starts mid-wheel (the original's 4.5 offset, between 4
     and 5) and rolls out to the real number.

     One deliberate departure. The original paints its top/bottom fade as a
     gradient in a caller-supplied background colour; these cards sit on a
     translucent, blurred surface, so a colour gradient would smear against
     whatever showed through. Masking fades the digits themselves to
     transparent instead -- same intent, and it holds over any backdrop. */
  .ticker {
    --tk-h: 1.5em;      /* one digit cell: the glyph plus the space it rolls through */
    --tk-fade: 0.22em;  /* the fog at each end, over the cell's padding only */
    display: inline-flex;
    align-items: stretch;
    height: var(--tk-h);
    font-variant-numeric: tabular-nums;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 var(--tk-fade), #000 calc(100% - var(--tk-fade)), transparent 100%);
    mask-image: linear-gradient(to bottom, transparent 0, #000 var(--tk-fade), #000 calc(100% - var(--tk-fade)), transparent 100%);
  }
  .ticker .tk-col {
    height: var(--tk-h);
    overflow: hidden;
  }
  .ticker .tk-strip {
    display: flex;
    flex-direction: column;
    /* Overdamped-with-a-kick, which is what interpolatingSpring(stiffness: 8,
       damping: 8, initialVelocity: 2).speed(6) actually resolves to: fast
       away, barely any overshoot, settles rather than bounces. */
    transition: transform 620ms cubic-bezier(0.2, 1.06, 0.25, 1);
    will-change: transform;
  }
  .ticker .tk-strip > span {
    height: var(--tk-h);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ticker .tk-sep {
    display: flex;
    align-items: center;
    padding: 0 0.02em;
  }
  .ticker.tk-lg {
    font-size: 34px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  /* No highlight on the wheel itself: a gradient per digit column paints a
     visible block behind each glyph rather than a curved surface. The fade
     mask is what gives the drum its shape. */
  .ticker.good { color: var(--good-text); }
  .ticker.critical { color: var(--critical); }
  @media (prefers-reduced-motion: reduce) {
    /* The roll is decoration; the number is the content. */
    .ticker .tk-strip { transition: none; }
  }

  /* ---- Accounts view -------------------------------------------------- */
  .acct {
    margin-bottom: 22px;
  }
  .acct-hd {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
  }
  .acct-hd h2 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  .acct-meta {
    font-size: 12px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }
  .acct-tag {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--copper);
    border: 1px solid var(--copper);
    padding: 2px 8px;
  }
  /* Flex rather than grid, specifically so the last row stretches to fill.
     An auto-fit grid leaves a dead panel wherever the cell count is not a
     multiple of the column count, and that gap reads as a rendering fault
     rather than as empty space. */
  .acct-body {
    display: flex;
    flex-wrap: wrap;
  }
  .acct-body .cell {
    flex: 1 1 168px;
    padding: 16px 18px;
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }
  .acct-body .cell:last-child { border-right: none; }
  /* The headline number earns roughly two columns, not the whole row. */
  .acct-body .cell.hero { flex: 2 1 288px; }
  .cell .label {
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .cell .sub {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 6px;
    font-variant-numeric: tabular-nums;
  }
  .cell .value-sm {
    font-size: 19px;
    font-weight: 600;
  }

  /* Margin headroom. The bar is a meter, so it carries data colour: green
     while there is room, amber approaching the line, red past it. */
  .meter {
    height: 8px;
    background: var(--accent-wash);
    border: 1px solid var(--border);
    overflow: hidden;
    margin-top: 10px;
  }
  .meter span {
    display: block;
    height: 100%;
    background: var(--good);
    transition: width 620ms cubic-bezier(0.2, 1.06, 0.25, 1);
  }
  .meter.warn span { background: var(--warning); }
  .meter.crit span { background: var(--critical); }

  /* The combined card is an assertion the others are not -- it adds numbers
     from different currencies together -- so it is marked out as one. */
  .acct.total { border-color: var(--accent); }
  /* Accounts side by side. The All view is meant to fit one screen, which is
     why its cards are compact -- a holdings list is what makes a card taller
     than a viewport, and it lives in the per-account tabs instead. */
  .acct-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(430px, 1fr));
    gap: 22px;
    align-items: start;
  }
  .acct-grid .acct { margin-bottom: 0; }

  .acct-nav-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .acct-nav-row .fx-pick { margin-bottom: 0; }

  .fx-pick {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .fx-pick .fl { margin-right: 2px; }
  .fx-pick .pill {
    padding: 4px 10px;
    font-size: 11px;
    letter-spacing: 0.04em;
  }
  .note.warn { color: var(--critical); }

  .acct-rows {
    /* No top border: the cells above already draw one along their bottom. */
    padding: 14px 18px 16px;
  }
  .acct-rows h3 {
    margin: 0 0 10px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .hold {
    display: grid;
    grid-template-columns: 74px 1fr auto;
    align-items: center;
    gap: 12px;
    padding: 5px 0;
    font-size: 13px;
  }
  .hold .sym { font-weight: 600; }
  .hold .track {
    position: relative;
    height: 14px;
    background: var(--gridline);
  }
  .hold .track i {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    background: var(--accent);
    opacity: 0.55;
    transition: width 620ms cubic-bezier(0.2, 1.06, 0.25, 1);
  }
  .hold .amt {
    font-variant-numeric: tabular-nums;
    color: var(--text-secondary);
    white-space: nowrap;
  }
  .hold .qty {
    font-size: 11px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }
  .ccy-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 22px;
    font-size: 12px;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
    padding: 3px 0;
  }
  .ccy-row b { color: var(--text-primary); font-weight: 600; }
  .note {
    margin-top: 10px;
    font-size: 11px;
    color: var(--text-muted);
  }
  .acct.failed { border-color: var(--critical); }
  .acct .err {
    padding: 16px 18px;
    font-size: 13px;
    color: var(--critical);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    word-break: break-word;
  }

  .hidden { display: none !important; }</style>
</head>
<body>
<div class="page">
  <!--
    Two workspaces, and the line between them is the data, not the layout:
    ANALYSIS is live -- every snapshot is stale the moment it is read, so the
    question is always "what do I hold right now". RESEARCH is fixed -- a
    dataset that does not move, which is what makes a backtest repeatable.
    Mixing them would put a number that changes under your cursor next to one
    that must not.
  -->
  <header class="hd">
    <div>
      <h1 id="wsTitle">Analysis</h1>
      <p id="subtitle"></p>
    </div>
    <div class="views ws" id="workspaces">
      <button data-ws="analysis" class="active">Analysis</button>
      <button data-ws="research">Research</button>
    </div>
  </header>

  <div class="ws-pane" id="analysisWs">
    <div class="viewbar">
      <div class="views" id="views">
        <button data-view="calendar" class="active">Calendar</button>
        <button data-view="gantt">Gantt</button>
        <button data-view="table">Table</button>
        <button data-view="accounts" id="accountsTab" class="hidden">Accounts</button>
      </div>
    </div>

    <div class="filters spread-only" id="filters">
      <span class="fl">Underlying</span>
    </div>

    <div class="stats spread-only" id="stats"></div>

    <div class="legend spread-only">
      <span class="item"><span class="dot" style="background:var(--good)"></span>Net gain</span>
      <span class="item"><span class="dot" style="background:var(--critical)"></span>Net loss</span>
      <span class="item"><span class="ring"></span>In decision zone</span>
      <span class="item"><span class="diamond"></span>Earnings before expiry</span>
      <span class="item"><svg class="star" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.7 7-6.3-3.9-6.3 3.9 1.7-7L2 9.2l7.1-.6z"/></svg>Recent headline</span>
    </div>

    <div id="calendarView"></div>
    <div id="ganttView" class="hidden"></div>
    <div id="tableView" class="hidden"></div>
    <div id="accountsView" class="hidden"></div>
  </div>

  <div class="ws-pane hidden" id="researchWs"></div>
</div>

<div class="tooltip" id="tooltip"></div>

</body>
</html>
