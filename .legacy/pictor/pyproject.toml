[project]
name = "pictor"
version = "0.1.0"
description = "Visualization layer for option spread positions -- expiry Gantt charts with earnings/news enrichment."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "plotly>=5.24",
    "yfinance>=0.2",
    "typer>=0.12",
]

[project.optional-dependencies]
ibkr = ["ib_insync>=0.9.86"]

[project.scripts]
pictor = "pictor.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pictor"]
